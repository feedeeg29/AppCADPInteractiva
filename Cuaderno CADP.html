<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Cuaderno CADP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior + índice de prácticas a la izquierda (chips arriba en el teléfono) + área de estudio con pestañas.
   La única nota fuerte: el código se ve como el IDE azul de Turbo Pascal. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#E9EDF5; --ink:#141A2E; --muted:#58617C; --line:#D8DEEA;
  --accent:#2340B8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB; --hi:#F5C518;
  --ok:#1C7F4E; --ok-soft:#DDF2E6; --bad:#B8402B; --bad-soft:#F9E1DC; --warn:#9A6400; --warn-soft:#FBEFD3;
  --ide-bg:#0B1F9E; --ide-ink:#E8ECFF; --ide-kw:#FFE15A; --ide-str:#7DF0C5; --ide-num:#FFB38A; --ide-com:#9FB0F2; --ide-line:#2A3FB8; --ide-hl:#1C34C9;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1120; --surface:#151B2F; --sunk:#1B2238; --ink:#E7EAF4; --muted:#9BA4BF; --line:#283152;
  --accent:#93A8FF; --accent-ink:#0D1120; --accent-soft:#1F2A55; --hi:#F5C518;
  --ok:#5CCB92; --ok-soft:#163626; --bad:#FF8B76; --bad-soft:#3A1B17; --warn:#F2C25B; --warn-soft:#3A2D12;
  --ide-bg:#0A1872; --ide-line:#22339A; --ide-hl:#1A2DB0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#151B2F; --sunk:#1B2238; --ink:#E7EAF4; --muted:#9BA4BF; --line:#283152;
  --accent:#93A8FF; --accent-ink:#0D1120; --accent-soft:#1F2A55; --hi:#F5C518;
  --ok:#5CCB92; --ok-soft:#163626; --bad:#FF8B76; --bad-soft:#3A1B17; --warn:#F2C25B; --warn-soft:#3A2D12;
  --ide-bg:#0A1872; --ide-line:#22339A; --ide-hl:#1A2DB0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:4px}
code{font-family:var(--f-code);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--hi);vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.gbar{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.meter{width:140px;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.sync{font-size:12px;color:var(--muted)}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;display:flex;flex-direction:column;gap:4px}
.side .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 10px 6px}
.nav{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:2px 8px;text-align:left;background:none;border:1px solid transparent;border-radius:var(--r);padding:8px 10px;cursor:pointer}
.nav:hover{background:var(--surface);border-color:var(--line)}
.nav[aria-current="true"]{background:var(--surface);border-color:var(--accent)}
.nav .n{grid-row:span 2;font-family:var(--f-code);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;text-align:center;padding:4px 0}
.nav .t{font-weight:600;font-size:15px;line-height:1.2}
.nav .p{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden}
.nav .p i{display:block;height:100%;background:var(--ok)}

main{min-width:0}
.hero{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.eyebrow{font-family:var(--f-code);font-size:13px;color:var(--muted)}
.hero h1{font-size:clamp(30px,4.2vw,44px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;max-width:64ch;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);padding:1px 8px;border-radius:99px}
.tab .badge.done{background:var(--ok-soft);color:var(--ok)}

/* teoría */
.prose{max-width:74ch;display:flex;flex-direction:column;gap:14px}
.prose h2{font-size:24px;font-weight:700;margin-top:14px}
.prose p{margin:0}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tip{background:var(--warn-soft);border-left:4px solid var(--hi);padding:12px 16px;border-radius:0 var(--r) var(--r) 0}
.tip::before{content:"Ojo";display:block;font-family:var(--f-code);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-bottom:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--sunk);font-weight:700}

/* bloque de código estilo IDE */
.ide{background:var(--ide-bg);color:var(--ide-ink);border-radius:var(--r);overflow:hidden;font-family:var(--f-code);font-size:14px;line-height:1.6;position:relative;min-width:0}
.ide .bar{display:flex;align-items:center;gap:8px;background:var(--ide-line);padding:4px 10px;font-size:12px;color:var(--ide-com)}
.ide .bar b{color:var(--ide-ink);font-weight:600}
.ide .bar button{margin-left:auto;background:none;border:1px solid var(--ide-com);color:var(--ide-ink);border-radius:5px;font-size:12px;padding:1px 8px;cursor:pointer;font-family:var(--f-code)}
.ide pre{margin:0;padding:12px 0;overflow-x:auto}
.ide .ln{display:block;padding:0 14px;white-space:pre;min-height:1.6em}
.ide .ln.cur{background:var(--ide-hl);box-shadow:inset 3px 0 0 var(--hi)}
.ide .ln[data-n]::before{content:attr(data-n);display:inline-block;width:2.2em;color:var(--ide-com);opacity:.7;user-select:none}
.k{color:var(--ide-kw);font-weight:600}.s{color:var(--ide-str)}.nu{color:var(--ide-num)}.c{color:var(--ide-com);font-style:italic}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* quiz */
.qlist{display:flex;flex-direction:column;gap:16px;max-width:78ch}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.q .qh{display:flex;gap:10px;align-items:baseline}
.q .qn{font-family:var(--f-code);font-size:13px;color:var(--muted);flex:none}
.q .qt{font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font-family:var(--f-code);font-size:13px;font-weight:600;color:var(--muted);flex:none;padding-top:2px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.exp{font-size:15px;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.exp b{color:var(--ok)}.exp.no b{color:var(--bad)}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}

/* ejercicios */
.elist{display:flex;flex-direction:column;gap:14px;max-width:82ch}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ex.done{border-color:var(--ok)}
.ex .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ref{font-family:var(--f-code);font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:5px}
.ex h3{font-size:19px;font-weight:700}
.ex p{margin:0}
.chk{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
details{border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--accent);padding:2px 0}
details[open] summary{margin-bottom:8px}
.pista{background:var(--warn-soft);padding:10px 12px;border-radius:8px}

/* inicio */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .ch{display:flex;justify-content:space-between;align-items:center}
.card h3{font-size:20px;font-weight:700}
.card p{margin:0;font-size:15px;color:var(--muted);flex:1}
.stats{display:flex;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats span b{color:var(--ink)}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.section-h{font-size:22px;font-weight:700;margin:26px 0 12px}
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-bottom:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:18px;margin-bottom:8px}
.panel ol,.panel ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}

/* simuladores */
.sim{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.stage h3{font-size:17px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.field input,.field select{width:92px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:15px}
.field.wide input{width:200px}
.msg{font-size:15px;padding:10px 12px;border-radius:8px;background:var(--sunk);min-height:2.6em}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.okm{background:var(--ok-soft);color:var(--ok)}
.player{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.player .pos{font-family:var(--f-code);font-size:13px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.simpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.simpick .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.vec{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;padding:22px 2px 30px;position:relative}
.cell{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.cell .box{width:100%;aspect-ratio:1;max-width:100%;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--f-code);font-weight:600;font-size:clamp(12px,1.4vw,16px);transition:background .2s,border-color .2s,transform .2s}
.cell .idx{font-family:var(--f-code);font-size:12px;color:var(--muted)}
.cell.used .box{background:var(--accent-soft);border-color:var(--accent)}
.cell.stale .box{color:var(--muted);border-style:dashed;opacity:.6}
.cell.cmp .box{background:var(--warn-soft);border-color:var(--hi);transform:translateY(-4px)}
.cell.mov .box{background:var(--hi);color:#141A2E;border-color:var(--hi)}
.cell.new .box{background:var(--ok-soft);border-color:var(--ok)}
.cell.found .box{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.cell .tag{position:absolute;bottom:-24px;font-family:var(--f-code);font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap}
.cell .tagt{position:absolute;top:-20px;font-family:var(--f-code);font-size:11px;font-weight:600;color:var(--bad);white-space:nowrap}

.mem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
.mem .col{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.mem .col h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.var{display:flex;align-items:center;gap:8px;font-family:var(--f-code);font-size:14px;flex-wrap:wrap}
.var .nm{font-weight:600;min-width:1.4em}
.addr{padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.blk{display:flex;align-items:center;gap:8px;font-family:var(--f-code);font-size:14px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.blk .a{font-weight:600}
.blk .v{margin-left:auto;font-weight:600}
.blk.freed{opacity:.5;border-style:dashed}
.blk.lost{border-color:var(--bad);background:var(--bad-soft)}
.c0{--c:#2F6BFF}.c1{--c:#E5484D}.c2{--c:#12A37A}.c3{--c:#C47A00}.c4{--c:#8E4EC6}.c5{--c:#0E8FA8}
.addr.cx,.blk.cx .a{color:var(--c);border-color:var(--c)}
.empty{font-size:14px;color:var(--muted);font-style:italic}

.lst{display:flex;align-items:center;gap:0;overflow-x:auto;padding:26px 4px 30px;min-height:120px}
.ptr{flex:none;font-family:var(--f-code);font-size:13px;font-weight:700;color:var(--accent);margin-right:6px}
.node{flex:none;display:flex;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--f-code);position:relative;transition:border-color .2s,background .2s}
.node .d{padding:8px 8px;font-weight:600;font-size:15px;min-width:36px;text-align:center}
.node .sg{padding:8px 5px;border-left:2px solid var(--line);color:var(--muted);font-size:12px;display:grid;place-items:center}
.node.hl{border-color:var(--hi);background:var(--warn-soft)}
.node.nw{border-color:var(--ok);background:var(--ok-soft)}
.node.del{border-color:var(--bad);background:var(--bad-soft)}
.node .lb{position:absolute;top:-22px;left:0;right:0;text-align:center;font-family:var(--f-code);font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
.node .lb2{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-family:var(--f-code);font-size:11px;font-weight:700;color:var(--bad);white-space:nowrap}
.arrow{flex:none;width:18px;height:2px;background:var(--muted);position:relative;margin:0 2px}
.arrow::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--muted);border-right:0}
.nil{flex:none;font-family:var(--f-code);font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:6px 8px}
.nuebox{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);min-height:48px}

.trace-in{display:flex;gap:4px;flex-wrap:wrap;font-family:var(--f-code);font-size:14px}
.trace-in span{padding:3px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.trace-in span.cur{background:var(--hi);color:#141A2E;border-color:var(--hi)}
.trace-in span.done{opacity:.45}
.frames{display:flex;flex-direction:column;gap:10px}
.frame{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.frame h4{margin:0;padding:5px 10px;background:var(--sunk);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.frame table{border-collapse:collapse;width:100%;font-family:var(--f-code);font-size:14px}
.frame td{padding:5px 10px;border-top:1px solid var(--line)}
.frame td:first-child{font-weight:600;width:40%}
.frame td.chg{background:var(--warn-soft);color:var(--warn);font-weight:700}
.out{font-family:var(--f-code);font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px;white-space:pre-wrap;min-height:2.4em}
.out::before{content:"Salida";display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);margin-bottom:2px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;z-index:50}

@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
  .side .lbl{display:none}
  .nav{flex:none;grid-template-columns:auto auto;padding:6px 10px;background:var(--surface);border-color:var(--line)}
  .nav .n{grid-row:auto;padding:3px 6px}
  .nav .p{display:none}
  .nav .t{font-size:14px;white-space:nowrap}
  .sim,.intro{grid-template-columns:minmax(0,1fr)}
  .meter{width:80px}
}
@media (max-width:520px){
  body{font-size:16px}
  .mem{grid-template-columns:minmax(0,1fr)}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<header class="top">

  num, res : integer;

    { ref: "P4·1 Ej 7", titulo: "Ocurrencias de cada dígito",

      sol: `program digitos;
type vCont = array [0..9] of integer;
procedure inicializar(var c : vCont);
var i : integer;
begin
  for i := 0 to 9 do c[i] := 0;
end;
procedure descomponer(num : integer; var c : vCont);
begin
  repeat
    c[num mod 10] := c[num mod 10] + 1;
    num := num div 10;
  until (num = 0);
end;
procedure informar(c : vCont);
var i, max, digMax : integer;
begin
  max := -1; digMax := 0;
  for i := 0 to 9 do begin
    if (c[i] > 0) then writeln('Número ', i, ': ', c[i], ' veces');
    if (c[i] > max) then begin max := c[i]; digMax := i; end;
  end;
  writeln('El dígito más leído fue el ', digMax);
  write('Sin ocurrencias:');
  for i := 0 to 9 do
    if (c[i] = 0) then write(' ', i);
  writeln;
end;
var
  c : vCont;
  num : integer;
begin
  inicializar(c);
  read(num);
  while (num <> -1) do begin
    descomponer(num, c);
    read(num);

  informar(c);
end.` },
    { ref: "P4·2 Ej 2", titulo: "Nombres: eliminar, insertar, agregar",
      enunciado: "Cargar nombres (a lo sumo 500) hasta 'ZZZ'. Luego: eliminar la primera ocurrencia de un nombre leído, insertar un nombre en la posición 4 y agregar uno al final. Validar todo.",
      pista: "Reusá buscar + eliminar(pos), insertar(pos) y agregar. Cada uno devuelve un boolean ok para informar si se pudo.",
      sol: `const DIMF = 500;
type
  str20 = string[20];
  vNombres = array [1..DIMF] of str20;

function posicion(v : vNombres; dimL : integer; n : str20) : integer;
var i : integer;
begin
  i := 1;
  while (i <= dimL) and (v[i] <> n) do i := i + 1;
  if (i <= dimL) then posicion := i else posicion := -1;
end;

procedure eliminarNombre(var v : vNombres; var dimL : integer;
                         n : str20; var ok : boolean);
var pos, i : integer;
begin
  pos := posicion(v, dimL, n);
  ok := (pos <> -1);
  if ok then begin
    for i := pos to dimL - 1 do v[i] := v[i + 1];
    dimL := dimL - 1;
  end;
end;

procedure insertarEn(var v : vNombres; var dimL : integer;
                     n : str20; pos : integer; var ok : boolean);
var i : integer;
begin
  ok := (dimL < DIMF) and (pos >= 1) and (pos <= dimL + 1);
  if ok then begin
    for i := dimL downto pos do v[i + 1] := v[i];
    v[pos] := n;
    dimL := dimL + 1;
  end;
end;

procedure agregar(var v : vNombres; var dimL : integer;
                  n : str20; var ok : boolean);
begin
  ok := (dimL < DIMF);
  if ok then begin
    dimL := dimL + 1;
    v[dimL] := n;
  end;
end;` },
    { ref: "P4·2 Ej 1", titulo: "¿Está n en el vector?",
      enunciado: "(a) Módulo que reciba un vector de enteros (a lo sumo 500) y un valor n y devuelva si n está. (b) Lo mismo, con el vector ordenado de forma ascendente.",

      sol: `{ a) desordenado }
function esta(v : vNum; dimL, n : integer) : boolean;
var i : integer;
begin
  i := 1;
  while (i <= dimL) and (v[i] <> n) do i := i + 1;
  esta := (i <= dimL);
end;

{ b) ordenado ascendente }
function estaOrd(v : vNum; dimL, n : integer) : boolean;
var i : integer;
begin
  i := 1;
  while (i <= dimL) and (v[i] < n) do i := i + 1;
  estaOrd := (i <= dimL) and (v[i] = n);
end;` }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const KW = new Set(("program procedure function begin end var const type record array of if then else while do repeat until for to downto case " +
  "and or not div mod nil new dispose integer real char boolean string longint true false read readln write writeln sizeof").split(" "));

function highlightLines(code) {
  const re = /(\{[^}]*\}|\(\*[\s\S]*?\*\))|('(?:[^']|'')*')|(\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/gi;
  let html = "", m;
  const wrap = (cls, txt) => txt.split("\n").map(p => p ? `<span class="${cls}">${esc(p)}</span>` : "").join("\n");
  while ((m = re.exec(code))) {
    if (m[1]) html += wrap("c", m[1]);
    else if (m[2]) html += wrap("s", m[2]);
    else if (m[3]) html += wrap("nu", m[3]);
    else if (m[4]) html += KW.has(m[4].toLowerCase()) ? wrap("k", m[4]) : esc(m[4]);
    else html += esc(m[5]);
  }
  return html.split("\n");
}

const COPY = [];
function ide(code, opts = {}) {
  const lines = highlightLines(code);
  const id = COPY.push(code) - 1;
  const nums = opts.numbers;
  const body = lines.map((l, i) => `<span class="ln"${nums ? ` data-n="${i + 1}"` : ""}>${l || " "}</span>`).join("");
  return `<div class="ide"${opts.id ? ` id="${opts.id}"` : ""}><div class="bar"><b>${esc(opts.title || "pascal")}</b>${opts.copy === false ? "" : `<button type="button" data-copy="${id}">Copiar</button>`}</div><pre>${body}</pre></div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const txt = COPY[+b.dataset.copy];
  const done = () => toast("Código copiado");
  try {
    navigator.clipboard.writeText(txt).then(done, () => selectCode(b));
  } catch (_) { selectCode(b); }
});
function selectCode(b) {
  const pre = b.closest(".ide").querySelector("pre");
  const r = document.createRange(); r.selectNodeContents(pre);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);

}

function temaPct(t) {
  const s = tp(t.id);
  const ejDone = t.ejercicios.filter((_, i) => s.ej[i]).length;
  return Math.round(((s.teoria ? 1 : 0) + s.best / t.quiz.length + ejDone / t.ejercicios.length) / 3 * 100);

function merge(o) {
  if (!o || !o.t) return;
  for (const [id, s] of Object.entries(o.t)) {
    const m = tp(id);
    m.teoria = m.teoria || !!s.teoria;
    m.best = Math.max(m.best, s.best || 0);
    m.tries = Math.max(m.tries, s.tries || 0);
    for (const k of Object.keys(s.ej || {})) if (s.ej[k]) m.ej[k] = true;
  }
  P.mix = Math.max(P.mix || 0, o.mix || 0);
  if (!P.last && o.last) P.last = o.last;
}

function renderTema() {
  const t = current.tema, s = tp(t.id);
  const ejDone = t.ejercicios.filter((_, i) => s.ej[i]).length;
  const badge = {
    teoria: s.teoria ? `<span class="badge done">leída</span>` : "",
    quiz: `<span class="badge${s.best === t.quiz.length ? " done" : ""}">${s.best}/${t.quiz.length}</span>`,
    ej: `<span class="badge${ejDone === t.ejercicios.length ? " done" : ""}">${ejDone}/${t.ejercicios.length}</span>`,
    sim: ""
  };
  $("#main").innerHTML = `
  <section class="hero">
    <div class="eyebrow">${t.num} · ${esc(t.fuente)}</div>
    <h1>${esc(t.titulo)}</h1>
    <p>${esc(t.resumen)}</p>
  </section>
  <div class="tabs" role="tablist">${TABS.filter(([k]) => k !== "sim" || t.sim).map(([k, l]) =>
    `<button class="tab" role="tab" type="button" aria-selected="${current.tab === k}" data-tab="${k}">${l}${badge[k]}</button>`).join("")}</div>
  <div id="pane"></div>`;
  $$(".tab").forEach(b => b.addEventListener("click", () => {
    location.hash = t.id + (b.dataset.tab === "teoria" ? "" : "-" + b.dataset.tab);
  }));
  const pane = $("#pane");
  if (current.tab === "teoria") renderTeoria(t, pane);
  else if (current.tab === "quiz") renderQuiz(t.quiz, pane, (ok) => {
    s.tries++; if (ok > s.best) s.best = ok; save(); refreshBadges();
  });
  else if (current.tab === "ej") renderEj(t, pane);
  else renderSim(t, pane);
}
function refreshBadges() {
  const t = current.tema; if (!t) return;
  const s = tp(t.id);
  const ejDone = t.ejercicios.filter((_, i) => s.ej[i]).length;
  const q = $('.tab[data-tab="quiz"] .badge'); if (q) { q.textContent = s.best + "/" + t.quiz.length; q.classList.toggle("done", s.best === t.quiz.length); }
  const e = $('.tab[data-tab="ej"] .badge'); if (e) { e.textContent = ejDone + "/" + t.ejercicios.length; e.classList.toggle("done", ejDone === t.ejercicios.length); }
  const tb = $('.tab[data-tab="teoria"]');
  if (tb) { let b = tb.querySelector(".badge"); if (s.teoria && !b) tb.insertAdjacentHTML("beforeend", `<span class="badge done">leída</span>`); if (!s.teoria && b) b.remove(); }
}

function renderTeoria(t, pane) {
  const s = tp(t.id);

function renderQuiz(qs, pane, onFinish) {
  const ans = new Array(qs.length).fill(null);
  const L = "ABCD";
  pane.innerHTML = `<div class="qlist">${qs.map((q, i) => `
    <div class="q" id="q${i}">
      <div class="qh"><span class="qn">${String(i + 1).padStart(2, "0")}</span><div class="qt">${q.q}${q.tema ? ` <span class="ref">${q.tema}</span>` : ""}</div></div>
      ${q.code ? ide(q.code, { copy: false }) : ""}
      <div class="opts">${q.ops.map((o, j) => `<button class="opt" type="button" data-q="${i}" data-o="${j}"><span class="l">${L[j]}</span><span>${o}</span></button>`).join("")}</div>
      <div class="exp" hidden></div>
    </div>`).join("")}
    <div class="score" id="score"><div class="big" id="sc">0/${qs.length}</div><div id="sct">Respondé todas las preguntas para ver tu resultado.</div><button class="btn" id="retry" type="button" style="margin-left:auto">Reiniciar quiz</button></div>
  </div>`;
  pane.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.q, j = +b.dataset.o;
    if (ans[i] !== null) return;
    ans[i] = j;
    const q = qs[i], box = $("#q" + i);
    box.querySelectorAll(".opt").forEach((x, k) => {
      x.disabled = true;
      if (k === q.ok) x.classList.add("right");
      else if (k === j) x.classList.add("wrong");
    });
    const ex = box.querySelector(".exp");
    ex.hidden = false;
    ex.className = "exp" + (j === q.ok ? "" : " no");
    ex.innerHTML = `<b>${j === q.ok ? "Correcto." : "No es esa."}</b> ${q.exp}`;
    const ok = ans.filter((a, k) => a === qs[k].ok).length;
    const n = ans.filter(a => a !== null).length;
    $("#sc").textContent = ok + "/" + qs.length;
    if (n === qs.length) {
      $("#sct").textContent = ok === qs.length ? "Perfecto. Este tema está dominado." : ok >= qs.length * 0.7 ? "Bien. Repasá las que fallaste." : "Conviene volver a la teoría y reintentar.";
      onFinish(ok, qs.length);
    } else $("#sct").textContent = `Respondiste ${n} de ${qs.length}.`;
  }));
  $("#retry").addEventListener("click", () => { renderQuiz(qs, pane, onFinish); pane.scrollIntoView({ behavior: reduced ? "auto" : "smooth" }); });
}

/* ====== reproductor paso a paso (compartido por los simuladores) ====== */
const PLAYERS = [];
function stopPlayers() { PLAYERS.forEach(p => p.pause()); PLAYERS.length = 0; }

class Player {
  constructor(root, draw) {
    this.root = root; this.draw = draw; this.frames = []; this.i = 0; this.timer = null; this.speed = 900;
    root.innerHTML = `
      <div class="player">
        <button class="btn" type="button" data-a="first" aria-label="Volver al principio">⏮</button>
        <button class="btn" type="button" data-a="prev" aria-label="Paso anterior">◀ Anterior</button>
        <button class="btn pri" type="button" data-a="play">▶ Reproducir</button>
        <button class="btn" type="button" data-a="next" aria-label="Paso siguiente">Siguiente ▶</button>
        <label class="field"><span class="sr">Velocidad</span><select data-a="speed" id="spd-${PLAYERS.length}"><option value="1500">Lenta</option><option value="900" selected>Normal</option><option value="400">Rápida</option></select></label>
        <span class="pos"></span>
      </div>`;
    root.querySelector('[data-a="first"]').onclick = () => { this.pause(); this.show(0); };
    root.querySelector('[data-a="prev"]').onclick = () => { this.pause(); this.show(this.i - 1); };
    root.querySelector('[data-a="next"]').onclick = () => { this.pause(); this.show(this.i + 1); };
    root.querySelector('[data-a="play"]').onclick = () => this.timer ? this.pause() : this.play();
    root.querySelector('[data-a="speed"]').onchange = e => { this.speed = +e.target.value; if (this.timer) { this.pause(); this.play(); } };
    PLAYERS.push(this);
  }
  load(frames, autoplay) {
    this.pause(); this.frames = frames; this.show(0);
    if (autoplay && !reduced) this.play();
  }
  show(i) {
    if (!this.frames.length) return;
    this.i = Math.max(0, Math.min(this.frames.length - 1, i));
    this.draw(this.frames[this.i], this.i, this.frames.length);
    this.root.querySelector(".pos").textContent = `paso ${this.i + 1} de ${this.frames.length}`;
    if (this.i === this.frames.length - 1) this.pause();
  }
  play() {
    if (this.i >= this.frames.length - 1) this.show(0);
    this.root.querySelector('[data-a="play"]').textContent = "❚❚ Pausa";
    this.timer = setInterval(() => this.show(this.i + 1), this.speed);
  }
  pause() {
    clearInterval(this.timer); this.timer = null;
    const b = this.root.querySelector('[data-a="play"]'); if (b) b.textContent = "▶ Reproducir";
  }
}

/* ====== simulador de pruebas de escritorio ====== */
function tracer(tokens) {
  const frames = []; let out = "", pos = -1, prev = {};
  return {
    frames,
    read() { pos++; return tokens[pos]; },
    print(s) { out += s; },
    step(line, msg, fr, kind) {
      const flat = {};
      fr.forEach(f => Object.entries(f.vars).forEach(([k, v]) => flat[f.name + "." + k] = String(v)));
      const ch = Object.keys(flat).filter(k => prev[k] !== flat[k] && prev[k] !== undefined);
      prev = flat;
      frames.push({ line, msg, kind, fr: JSON.parse(JSON.stringify(fr)), ch, out, pos, tokens });
    }
  };
}
const nums = s => (s.match(/-?\d+/g) || []).map(Number);

const TRAZAS = {
  traza: [
    { id: "min", nombre: "Dos mínimos", label: "Números a leer", def: "8 3 12 1 5",
      code: n => `program dosMinimos;
var i, num, min1, min2 : integer;
begin
  min1 := 32767; min2 := 32767;
  for i := 1 to ${n} do begin
    read(num);
    if (num < min1) then begin
      min2 := min1;
      min1 := num;
    end
    else if (num < min2) then
      min2 := num;
  end;
  writeln(min1, ' ', min2);
end.`,
      prep: s => { const a = nums(s).slice(0, 8); return a.length ? a : [8, 3, 12, 1, 5]; },
      gen(a) {
        const T = tracer(a); const V = { i: "?", num: "?", min1: "?", min2: "?" };
        const F = () => [{ name: "Programa principal", vars: V }];
        T.step(2, "Se declaran las variables. Todavía no tienen valor: contienen basura.", F());
        V.min1 = 32767; V.min2 = 32767;
        T.step(4, "Ambos mínimos arrancan en 32767, el mayor integer. Así cualquier número leído es menor.", F());
        for (let i = 1; i <= a.length; i++) {
          V.i = i; T.step(5, `Vuelta ${i} del for.`, F());
          V.num = T.read(); T.step(6, `Se lee ${V.num}.`, F());
          if (V.num < V.min1) {
            T.step(7, `${V.num} < ${V.min1}: es el nuevo mínimo.`, F());
            V.min2 = V.min1; T.step(8, "El mínimo anterior pasa a ser el segundo.", F());
            V.min1 = V.num; T.step(9, "Se guarda el nuevo mínimo.", F());
          } else {
            T.step(7, `${V.num} no es menor que ${V.min1}.`, F());
            if (V.num < V.min2) { T.step(11, `Pero ${V.num} < ${V.min2}: es el nuevo segundo mínimo.`, F()); V.min2 = V.num; T.step(12, "Se actualiza min2.", F()); }
            else T.step(11, `Tampoco es menor que ${V.min2}: no cambia nada.`, F());
          }
        }
        T.print(V.min1 + " " + V.min2);
        T.step(14, `Fin del for. Se informan los dos mínimos.`, F(), "ok");
        return T.frames;
      } },
    { id: "dig", nombre: "Contar dígitos pares", label: "Número (hasta 32767)", def: "2504",
      code: () => `program contarPares;
var num, dig, cant : integer;
begin
  read(num);
  cant := 0;
  while (num <> 0) do begin
    dig := num mod 10;
    if (dig mod 2 = 0) then
      cant := cant + 1;
    num := num div 10;
  end;
  writeln(cant);
end.`,
      prep: s => { const a = nums(s); const n = a.length ? Math.abs(a[0]) : 2504; return [Math.min(n, 32767)]; },
      gen(a) {
        const T = tracer(a); const V = { num: "?", dig: "?", cant: "?" };
        const F = () => [{ name: "Programa principal", vars: V }];
        V.num = T.read(); T.step(4, `Se lee ${V.num}.`, F());
        V.cant = 0; T.step(5, "El contador empieza en 0.", F());
        while (V.num !== 0) {
          T.step(6, `${V.num} <> 0: entra al while.`, F());
          V.dig = V.num % 10; T.step(7, `${V.num} mod 10 = ${V.dig}: es el último dígito.`, F());
          if (V.dig % 2 === 0) { T.step(8, `${V.dig} es par.`, F()); V.cant++; T.step(9, "Se cuenta.", F()); }
          else T.step(8, `${V.dig} es impar: no se cuenta.`, F());
          const old = V.num; V.num = Math.trunc(V.num / 10); T.step(10, `${old} div 10 = ${V.num}: se descarta el último dígito.`, F());
        }
        T.step(6, "num vale 0: termina el while.", F());
        T.print(String(V.cant)); T.step(12, `Hay ${V.cant} dígitos pares.`, F(), "ok");
        return T.frames;
      } }
  ],
  parametros: [
    { id: "ref", nombre: "suma con var num2", label: "Valor inicial de x", def: "10", ref: true },
    { id: "val", nombre: "suma con num2 por valor", label: "Valor inicial de x", def: "10", ref: false },
    { id: "dpi", nombre: "digParesImpares", label: "Secuencia (termina en 100)", def: "250 35 100",
      code: () => `procedure digParesImpares(num : integer; var par, impar : integer);
var dig : integer;
begin
  while (num <> 0) do begin
    dig := num mod 10;
    if ((dig mod 2) = 0) then
      par := par + 1
    else
      impar := impar + 1;
    num := num DIV 10;
  end;
end;
var dato, par, impar : integer;
begin
  par := 0; impar := 0;
  repeat
    read(dato);
    digParesImpares(dato, par, impar);
  until (dato = 100);
  writeln('Pares: ', par, ' Impares: ', impar);
end.`,
      prep: s => { let a = nums(s).filter(x => x >= 0 && x <= 32767).slice(0, 5); if (!a.includes(100)) a.push(100); return a.slice(0, a.indexOf(100) + 1); },
      gen(a) {
        const T = tracer(a); const M = { dato: "?", par: "?", impar: "?" };
        let S = null;
        const F = () => S ? [{ name: "Programa principal", vars: M }, { name: "digParesImpares", vars: S }] : [{ name: "Programa principal", vars: M }];
        M.par = 0; M.impar = 0; T.step(15, "Se inicializan los contadores en el programa principal.", F());
        do {
          M.dato = T.read(); T.step(17, `Se lee ${M.dato}.`, F());
          S = { num: M.dato, dig: "?", par: "→ par = " + M.par, impar: "→ impar = " + M.impar };
          T.step(1, `Se invoca el módulo. num recibe una copia de ${M.dato}; par e impar son la misma memoria que las del principal.`, F());
          while (S.num !== 0) {
            S.dig = S.num % 10; T.step(5, `dig = ${S.dig}.`, F());
            if (S.dig % 2 === 0) { M.par++; S.par = "→ par = " + M.par; T.step(7, `${S.dig} es par: se incrementa par (y cambia en el principal).`, F()); }
            else { M.impar++; S.impar = "→ impar = " + M.impar; T.step(9, `${S.dig} es impar: se incrementa impar.`, F()); }
            S.num = Math.trunc(S.num / 10); T.step(10, `num = ${S.num}. Es la copia: dato no cambia.`, F());
          }
          S = null; T.step(18, "Termina el módulo. Su copia de num y dig desaparecen.", F());
          T.step(19, M.dato === 100 ? "dato = 100: termina el repeat." : `${M.dato} <> 100: otra vuelta.`, F());
        } while (M.dato !== 100);
        T.print(`Pares: ${M.par} Impares: ${M.impar}`); T.step(20, "Se informan los totales acumulados.", F(), "ok");
        return T.frames;
      } }
  ],
  corte: [
    { id: "autos", nombre: "Promedio por marca", label: "Autos marca:precio (ordenados por marca)", def: "Fiat:12000 Fiat:9000 Ford:8000 Ford:30000 Ford:15000 Toyota:11000", wide: true,
      code: () => `leerAuto(a);
while (a.marca <> 'ZZZ') do begin

end;`,
      prep: s => {

        if (!a.length) a = [{ m: "Fiat", p: 12000 }];

        const T = tracer(a.map(this.tok)); const V = { "a.marca": "?", "a.precio": "?", actual: "?", cant: "?", suma: "?" };
        const F = () => [{ name: "Programa principal", vars: V }];
        let k = -1; const leer = () => { k++; T.read(); const x = a[k]; V["a.marca"] = x.m; V["a.precio"] = x.m === "ZZZ" ? "?" : x.p; };
        leer(); T.step(1, `Lectura previa: ${V["a.marca"]}.`, F());
        const vistos = new Set();
        while (V["a.marca"] !== "ZZZ") {
          T.step(2, "No es el fin: empieza un grupo nuevo.", F());
          V.actual = V["a.marca"];
          const rep = vistos.has(V.actual); vistos.add(V.actual);
          T.step(3, `Se guarda la marca del grupo: ${V.actual}.` + (rep ? " Ojo: esta marca ya tuvo un grupo antes. Si los datos no vienen ordenados, el corte de control da resultados partidos." : ""), F(), rep ? "err" : undefined);
          V.cant = 0; V.suma = 0; T.step(4, "Los totales del grupo arrancan en 0.", F());
          while (V["a.marca"] === V.actual) {
            T.step(5, `${V["a.marca"]} = ${V.actual}: sigue el mismo grupo.`, F());
            V.cant++; T.step(6, "Se cuenta el auto.", F());
            V.suma += V["a.precio"]; T.step(7, "Se acumula el precio.", F());
            leer(); T.step(8, `Se lee el siguiente: ${V["a.marca"]}.`, F());
          }
          T.step(5, `${V["a.marca"]} ≠ ${V.actual}: terminó el grupo.`, F());
          T.print(`${V.actual}: ${(V.suma / V.cant).toFixed(2)}\n`);
          T.step(10, `Se informa el promedio de ${V.actual}.`, F(), "ok");
        }
        T.step(2, "Llegó ZZZ: termina el procesamiento.", F(), "ok");
        return T.frames;
      } }
  ]
};
/* los dos programas de suma comparten generador */
TRAZAS.parametros.slice(0, 2).forEach(p => {
  p.code = () => `program Ejercicio3;
procedure suma(num1 : integer; ${p.ref ? "var " : ""}num2 : integer);
begin
  num2 := num1 + num2;
  num1 := 0;
end;
var
  i, x : integer;
begin
  read(x);
  for i := 1 to 5 do
    suma(i, x);
  write(x);
end.`;
  p.prep = s => { const a = nums(s); return [a.length ? a[0] : 10]; };
  p.gen = function (a) {
    const T = tracer(a); const M = { i: "?", x: "?" }; let S = null;
    const F = () => S ? [{ name: "Programa principal", vars: M }, { name: "suma", vars: S }] : [{ name: "Programa principal", vars: M }];
    M.x = T.read(); T.step(10, `Se lee x = ${M.x}.`, F());
    for (let i = 1; i <= 5; i++) {
      M.i = i; T.step(11, `Vuelta ${i} del for.`, F());
      S = { num1: i, num2: p.ref ? "→ x = " + M.x : M.x };
      T.step(2, p.ref ? `num1 recibe una copia de i (${i}). num2 es un alias de x: misma memoria.` : `num1 recibe una copia de i (${i}) y num2 una copia de x (${M.x}).`, F());
      if (p.ref) { M.x = i + M.x; S.num2 = "→ x = " + M.x; T.step(4, `num2 := ${i} + ... = ${M.x}. Como es var, x cambia en el principal.`, F()); }
      else { S.num2 = i + S.num2; T.step(4, `num2 := ${i} + ... = ${S.num2}. Solo cambia la copia: x sigue en ${M.x}.`, F()); }
      S.num1 = 0; T.step(5, "num1 := 0 modifica la copia. i no cambia.", F());
      S = null; T.step(12, "Termina suma: sus parámetros por valor desaparecen.", F());
    }
    T.print(String(M.x)); T.step(13, p.ref ? `Se imprime ${M.x}.` : `Se imprime ${M.x}: el procedimiento nunca tocó x.`, F(), "ok");
    return T.frames;
  };
});

/* ====== simulador de vectores ====== */
const VCODE = {
  agregar: `procedure agregar(var v : vector; var dimL : integer;
                  valor : integer; var ok : boolean);
begin
  ok := (dimL < DIMF);
  if ok then begin
    dimL := dimL + 1;
    v[dimL] := valor;
  end;
end;`,
  insertar: `procedure insertar(var v : vector; var dimL : integer;
                   valor, pos : integer; var ok : boolean);
var i : integer;
begin
  ok := (dimL < DIMF) and (pos >= 1) and (pos <= dimL + 1);
  if ok then begin
    for i := dimL downto pos do
      v[i + 1] := v[i];
    v[pos] := valor;
    dimL := dimL + 1;
  end;
end;`,
  eliminar: `procedure eliminar(var v : vector; var dimL : integer;
                   pos : integer; var ok : boolean);
var i : integer;
begin
  ok := (pos >= 1) and (pos <= dimL);
  if ok then begin
    for i := pos to dimL - 1 do
      v[i] := v[i + 1];
    dimL := dimL - 1;
  end;
end;`,
  buscar: `function buscar(v : vector; dimL, n : integer) : integer;
var pos : integer;
begin
  pos := 1;
  while (pos <= dimL) and (v[pos] <> n) do
    pos := pos + 1;
  if (pos <= dimL) then buscar := pos
  else buscar := -1;
end;`,
  dico: `function buscarDico(v : vector; dimL, n : integer) : boolean;
var ini, fin, medio : integer;
begin
  ini := 1; fin := dimL;
  medio := (ini + fin) div 2;
  while (ini <= fin) and (v[medio] <> n) do begin
    if (n < v[medio]) then fin := medio - 1
    else ini := medio + 1;
    medio := (ini + fin) div 2;
  end;
  buscarDico := (ini <= fin);
end;`
};
const DIMF = 10;

function simVector(pane) {
  let st = { v: [4, 9, 2, 7, 5, null, null, null, null, null], dimL: 5 };
  let op = "agregar";
  pane.innerHTML = `
    <p style="max-width:70ch;margin:0 0 14px;color:var(--muted)">Un vector de dimensión física 10. Las celdas punteadas están fuera de la dimensión lógica: pueden tener valores viejos, pero no forman parte del vector. Probá insertar o eliminar y mirá el corrimiento.</p>
    <div class="sim">
      <div class="stage">
        <div class="controls">
          <label class="field"><span>Valor</span><input id="vval" type="number" value="6"></label>
          <label class="field"><span>Posición</span><input id="vpos" type="number" value="2" min="1" max="11"></label>
        </div>
        <div class="row">
          <button class="btn pri" type="button" data-op="agregar">Agregar al final</button>
          <button class="btn" type="button" data-op="insertar">Insertar en posición</button>
          <button class="btn" type="button" data-op="eliminar">Eliminar posición</button>
          <button class="btn" type="button" data-op="buscar">Buscar valor</button>
          <button class="btn" type="button" data-op="dico">Búsqueda dicotómica</button>
        </div>
        <div class="row">
          <button class="btn" type="button" id="vdes">Cargar desordenado</button>
          <button class="btn" type="button" id="vord">Cargar ordenado</button>
          <button class="btn" type="button" id="vvac">Vaciar (dimL := 0)</button>
        </div>
        <div class="vec" id="vvec"></div>
        <div class="msg" id="vmsg"></div>
        <div id="vplay"></div>
      </div>
      <div id="vcode"></div>
    </div>`;
  const draw = (f) => {
    const s = f.st;
    $("#vvec", pane).innerHTML = s.v.map((x, k) => {
      const i = k + 1;
      let cls = i <= s.dimL ? "used" : (x !== null ? "stale" : "");
      if (f.mk && f.mk[i]) cls += " " + f.mk[i];
      const tag = (f.tg && f.tg[i]) ? `<span class="tag">${f.tg[i]}</span>` : (i === s.dimL ? `<span class="tag">dimL</span>` : "");
      const tt = (f.tt && f.tt[i]) ? `<span class="tagt">${f.tt[i]}</span>` : "";
      return `<div class="cell ${cls}">${tt}<div class="box">${x === null ? "" : x}</div><span class="idx">${i}</span>${tag}</div>`;
    }).join("");
    setMsg($("#vmsg", pane), f);
    setCodeLine($("#vcode", pane), f.line);
  };
  const player = new Player($("#vplay", pane), draw);
  const cp = s => ({ v: s.v.slice(), dimL: s.dimL });
  const showCode = (k) => { $("#vcode", pane).innerHTML = ide(VCODE[k], { numbers: true, title: k === "dico" ? "buscarDico" : k }); };

  function run(k) {
    op = k;
    const val = parseInt($("#vval", pane).value, 10);
    const pos = parseInt($("#vpos", pane).value, 10);
    if (Number.isNaN(val) && k !== "eliminar") { toast("Ingresá un valor numérico"); return; }
    const F = []; let s = cp(st);
    const fr = (line, msg, extra = {}) => F.push(Object.assign({ line, msg, st: cp(s) }, extra));
    if (k === "agregar") {
      const ok = s.dimL < DIMF;
      fr(4, ok ? `dimL (${s.dimL}) < DIMF (${DIMF}): hay lugar.` : `dimL = DIMF = ${DIMF}: el vector está lleno. ok := false.`, ok ? {} : { kind: "err" });
      if (ok) {
        s.dimL++; fr(6, `dimL pasa a ${s.dimL}.`);
        s.v[s.dimL - 1] = val; fr(7, `v[${s.dimL}] := ${val}.`, { mk: { [s.dimL]: "new" }, kind: "ok" });
      }
    }
    if (k === "insertar") {
      const ok = s.dimL < DIMF && pos >= 1 && pos <= s.dimL + 1;
      fr(5, ok ? `Hay lugar y la posición ${pos} está entre 1 y dimL + 1 (${s.dimL + 1}).` :
        (s.dimL >= DIMF ? "El vector está lleno: no se puede insertar." : `La posición ${pos} no es válida: tiene que estar entre 1 y ${s.dimL + 1}.`), ok ? {} : { kind: "err" });
      if (ok) {
        for (let i = s.dimL; i >= pos; i--) {
          fr(7, `i = ${i}: hay que mover v[${i}] una posición a la derecha.`, { mk: { [i]: "cmp" }, tg: { [i]: "i" } });
          s.v[i] = s.v[i - 1];
          fr(8, `v[${i + 1}] := v[${i}]. Ahora el ${s.v[i]} está repetido; el de la izquierda se va a pisar.`, { mk: { [i + 1]: "mov" }, tg: { [i]: "i" } });
        }
        if (pos > s.dimL) fr(7, `pos = dimL + 1: no hay nada que correr.`);
        s.v[pos - 1] = val; fr(9, `v[${pos}] := ${val}.`, { mk: { [pos]: "new" } });
        s.dimL++; fr(10, `dimL pasa a ${s.dimL}. Inserción terminada.`, { mk: { [pos]: "new" }, kind: "ok" });
      }
    }
    if (k === "eliminar") {
      const ok = pos >= 1 && pos <= s.dimL;
      fr(5, ok ? `La posición ${pos} está entre 1 y dimL (${s.dimL}).` : `La posición ${pos} no es válida: tiene que estar entre 1 y ${s.dimL}.`, ok ? { mk: { [pos]: "cmp" } } : { kind: "err" });
      if (ok) {
        for (let i = pos; i <= s.dimL - 1; i++) {
          fr(7, `i = ${i}: se trae el valor de la derecha.`, { mk: { [i + 1]: "cmp" }, tg: { [i]: "i" } });
          s.v[i - 1] = s.v[i];
          fr(8, `v[${i}] := v[${i + 1}].`, { mk: { [i]: "mov" }, tg: { [i]: "i" } });
        }
        s.dimL--; fr(9, `dimL pasa a ${s.dimL}. El valor de la posición ${s.dimL + 1} queda ahí, pero ya no es parte del vector.`, { kind: "ok" });
      }
    }
    if (k === "buscar") {
      let p = 1; fr(4, "pos := 1.", { tg: { 1: "pos" } });
      while (p <= s.dimL && s.v[p - 1] !== val) {
        fr(5, `v[${p}] = ${s.v[p - 1]} ≠ ${val}: sigo.`, { mk: { [p]: "cmp" }, tg: { [p]: "pos" } });
        p++; fr(6, `pos := ${p}.`, { tg: { [p]: "pos" } });
      }
      if (p <= s.dimL) fr(7, `v[${p}] = ${val}: encontrado en la posición ${p}. Se revisaron ${p} elementos.`, { mk: { [p]: "found" }, tg: { [p]: "pos" }, kind: "ok" });
      else fr(8, `pos = ${p} > dimL: ${val} no está. Hubo que recorrer los ${s.dimL} elementos.`, { kind: "err" });
    }
    if (k === "dico") {
      const arr = s.v.slice(0, s.dimL);
      const sorted = arr.every((x, i) => i === 0 || arr[i - 1] <= x);
      if (!sorted) {
        fr(1, "El vector no está ordenado. La búsqueda dicotómica solo funciona sobre un vector ordenado: probá con \"Cargar ordenado\".", { kind: "err" });
      } else {
        let ini = 1, fin = s.dimL, m = Math.floor((ini + fin) / 2), vueltas = 0;
        const tags = () => { const t = {}; if (ini <= DIMF) t[ini] = "ini"; if (fin >= 1) t[fin] = (t[fin] ? t[fin] + "/" : "") + "fin"; return t; };
        fr(4, `ini := 1; fin := ${fin}.`, { tg: tags() });
        fr(5, `medio := (${ini} + ${fin}) div 2 = ${m}.`, { tg: tags(), tt: { [m]: "medio" }, mk: { [m]: "cmp" } });
        while (ini <= fin && s.v[m - 1] !== val) {
          vueltas++;
          if (val < s.v[m - 1]) { fin = m - 1; fr(7, `${val} < v[${m}] = ${s.v[m - 1]}: descarto la mitad derecha. fin := ${fin}.`, { tg: tags() }); }
          else { ini = m + 1; fr(8, `${val} > v[${m}] = ${s.v[m - 1]}: descarto la mitad izquierda. ini := ${ini}.`, { tg: tags() }); }
          m = Math.floor((ini + fin) / 2);
          fr(9, `medio := ${m}.`, { tg: tags(), tt: m >= 1 && m <= DIMF ? { [m]: "medio" } : {}, mk: ini <= fin ? { [m]: "cmp" } : {} });
        }
        if (ini <= fin) fr(11, `v[${m}] = ${val}: encontrado tras ${vueltas + 1} comparaciones (la lineal podría haber necesitado hasta ${s.dimL}).`, { mk: { [m]: "found" }, tt: { [m]: "medio" }, kind: "ok" });
        else fr(11, `ini (${ini}) > fin (${fin}): ${val} no está.`, { kind: "err" });
      }
    }
    st = s;
    showCode(k);
    player.load(F, true);
  }
  $$("[data-op]", pane).forEach(b => b.onclick = () => run(b.dataset.op));
  const setSt = (v, msg) => {
    st = { v: v.concat(Array(DIMF - v.length).fill(null)), dimL: v.length };
    showCode(op); player.load([{ line: 0, msg, st: cp(st) }]);
  };
  $("#vdes", pane).onclick = () => setSt(Array.from({ length: 6 }, () => 1 + Math.floor(Math.random() * 40)), "Se cargaron 6 valores al azar.");
  $("#vord", pane).onclick = () => { const a = Array.from({ length: 7 }, () => 1 + Math.floor(Math.random() * 60)).sort((x, y) => x - y); setSt(a, "Se cargaron 7 valores ordenados de forma ascendente. Ya podés usar la búsqueda dicotómica."); };
  $("#vvac", pane).onclick = () => { st = { v: st.v.slice(), dimL: 0 }; showCode(op); player.load([{ line: 0, msg: "dimL := 0. Los valores siguen en memoria, pero el vector se considera vacío.", st: cp(st) }]); };
  showCode(op);
  player.load([{ line: 0, msg: "Elegí una operación. Valor y posición se toman de los campos de arriba.", st: cp(st) }]);
}

/* ====== simulador de punteros ====== */
function simPunteros(pane) {
  let S;
  const reset = () => { S = { vars: { p: "?", q: "?" }, heap: [], next: 0x1A0, log: [], out: "", msg: { t: "Las variables p y q son punteros a integer. Todavía no se les asignó nada: tienen basura.", k: "" }, last: 0 }; };
  reset();
  pane.innerHTML = `
    <p style="max-width:70ch;margin:0 0 14px;color:var(--muted)">Ejecutá sentencias sobre dos punteros a integer y mirá qué pasa en la memoria estática y en el heap. Cada botón agrega una línea al programa de la derecha. Probá los errores clásicos: usar p^ sin new, o después de dispose.</p>
    <div class="sim">
      <div class="stage">
        <div class="controls">
          <label class="field"><span>Puntero</span><select id="pvar"><option value="p">p</option><option value="q">q</option></select></label>
          <label class="field"><span>Valor</span><input id="pval" type="number" value="7"></label>
        </div>
        <div class="row" id="pbtns"></div>
        <div class="mem">
          <div class="col"><h4><span>Memoria estática</span><span>8 bytes</span></h4><div id="pst"></div></div>
          <div class="col"><h4><span>Heap (memoria dinámica)</span><span id="pused"></span></h4><div id="pheap"></div></div>
        </div>
        <div class="out" id="pout"></div>
        <div class="msg" id="pmsg"></div>
        <div class="row"><button class="btn" type="button" id="preset">Empezar de nuevo</button></div>
      </div>
      <div id="pcode"></div>
    </div>`;
  const B = [["new", "new(X)"], ["asig", "X^ := valor"], ["write", "writeln(X^)"], ["dispose", "dispose(X)"], ["nil", "X := nil"], ["alias", "X := otro"]];
  const renderBtns = () => {
    const x = $("#pvar", pane).value, o = x === "p" ? "q" : "p";
    $("#pbtns", pane).innerHTML = B.map(([k, l]) => `<button class="btn${k === "new" ? " pri" : ""}" type="button" data-pk="${k}">${esc(l.replace("X", x).replace("otro", o).replace("valor", $("#pval", pane).value || "0"))}</button>`).join("");
    $$("[data-pk]", pane).forEach(b => b.onclick = () => act(b.dataset.pk));
  };
  const blk = a => S.heap.find(b => b.addr === a);
  const color = a => { const i = S.heap.findIndex(b => b.addr === a); return "c" + (i % 6); };
  const hex = n => "@" + n.toString(16).toUpperCase();
  function check(x) {
    const a = S.vars[x];
    if (a === "?") return `Error: ${x} nunca recibió una dirección (falta new(${x})). ${x}^ apunta a cualquier lugar de la memoria.`;
    if (a === "nil") return `Error: ${x} vale nil, no apunta a nada. No se puede acceder a ${x}^.`;
    if (blk(a).freed) return `Error: la memoria a la que apunta ${x} ya fue liberada con dispose. ${x} quedó "colgando".`;
    return null;
  }
  function markLost() {
    const lost = [];
    S.heap.forEach(b => {
      if (!b.freed && !b.lost && b.addr !== S.vars.p && b.addr !== S.vars.q) { b.lost = true; lost.push(b.addr); }
    });
    return lost.length ? ` Atención: el bloque ${lost.join(", ")} quedó sin ningún puntero que lo apunte. Esa memoria está perdida: ya no se puede usar ni liberar.` : "";
  }
  function act(k) {
    const x = $("#pvar", pane).value, o = x === "p" ? "q" : "p";
    const val = parseInt($("#pval", pane).value, 10) || 0;
    let line = "", msg = "", kind = "";
    if (k === "new") {
      const a = hex(S.next); S.next += 0x10;
      S.heap.push({ addr: a, val: "?", freed: false, lost: false });
      S.vars[x] = a; line = `new(${x});`;
      msg = `Se reservaron 2 bytes en el heap (lo que ocupa un integer) en ${a}. ${x} guarda esa dirección. El contenido todavía es basura.` + markLost();
      kind = msg.includes("perdida") ? "err" : "ok";
    } else if (k === "asig") {
      line = `${x}^ := ${val};`;
      const e = check(x);
      if (e) { msg = e; kind = "err"; } else { blk(S.vars[x]).val = val; msg = `Se escribe ${val} en la dirección ${S.vars[x]}.` + (S.vars[o] === S.vars[x] ? ` Como ${o} apunta al mismo lugar, ${o}^ también vale ${val}.` : ""); kind = "ok"; }
    } else if (k === "write") {
      line = `writeln(${x}^);`;
      const e = check(x);
      if (e) { msg = e; kind = "err"; } else { const v = blk(S.vars[x]).val; S.out += v + "\n"; msg = v === "?" ? `${x}^ nunca se inicializó: imprime basura.` : `Imprime ${v}.`; kind = v === "?" ? "err" : "ok"; }
    } else if (k === "dispose") {
      line = `dispose(${x});`;
      const e = check(x);
      if (e) { msg = e; kind = "err"; } else { blk(S.vars[x]).freed = true; msg = `Se liberan los 2 bytes de ${S.vars[x]}. Ojo: ${x} sigue guardando esa dirección, pero ya no es válida.` + (S.vars[o] === S.vars[x] ? ` ${o} también queda colgando.` : "") + " Conviene hacer " + x + " := nil."; kind = "ok"; }
    } else if (k === "nil") {
      line = `${x} := nil;`; S.vars[x] = "nil";
      msg = `${x} ya no apunta a nada.` + markLost(); kind = msg.includes("perdida") ? "err" : "ok";
    } else if (k === "alias") {
      line = `${x} := ${o};`; S.vars[x] = S.vars[o];
      msg = S.vars[o] === "?" ? `${o} tenía basura y ahora ${x} también.` : `${x} copia la dirección de ${o}: ahora los dos apuntan al mismo lugar. No se copió el contenido.` + markLost();
      kind = msg.includes("perdida") || S.vars[o] === "?" ? "err" : "ok";
    }
    S.log.push(line); S.last = S.log.length; S.msg = { t: msg, k: kind };
    draw();
  }
  function draw() {
    const v = (x) => {
      const a = S.vars[x];
      const body = a === "?" ? `<span class="addr">? basura</span>` : a === "nil" ? `<span class="addr">nil</span>` : `<span class="addr cx ${color(a)}">${a}</span>${blk(a).freed ? `<span class="empty">liberada</span>` : ""}`;
      return `<div class="var"><span class="nm">${x}</span>${body}<span class="empty" style="margin-left:auto">4 bytes</span></div>`;
    };
    $("#pst", pane).innerHTML = v("p") + v("q");
    const vis = S.heap.slice(-8);
    $("#pheap", pane).innerHTML = vis.length ? vis.map(b => {
      const who = ["p", "q"].filter(x => S.vars[x] === b.addr).join(", ");
      return `<div class="blk cx ${color(b.addr)}${b.freed ? " freed" : ""}${b.lost ? " lost" : ""}"><span class="a">${b.addr}</span><span>${b.freed ? "liberado" : b.lost ? "perdido" : who ? "← " + who : ""}</span><span class="v">${b.freed ? "" : b.val}</span></div>`;
    }).join("") : `<div class="empty">Vacío. Hacé new para reservar memoria.</div>`;
    const used = S.heap.filter(b => !b.freed).length * 2;
    $("#pused", pane).textContent = used + " bytes en uso";
    $("#pout", pane).textContent = S.out;
    const m = $("#pmsg", pane); m.className = "msg" + (S.msg.k === "err" ? " err" : S.msg.k === "ok" ? " okm" : ""); m.textContent = S.msg.t;
    const prog = `program punteros;\ntype\n  pNum = ^integer;\nvar\n  p, q : pNum;\nbegin\n` + S.log.map(l => "  " + l).join("\n") + (S.log.length ? "\n" : "") + "end.";
    $("#pcode", pane).innerHTML = ide(prog, { numbers: true, title: "tu programa" });
    setCodeLine($("#pcode", pane), S.last ? 6 + S.last : 0);
  }
  $("#pvar", pane).onchange = renderBtns;
  $("#pval", pane).oninput = renderBtns;
  $("#preset", pane).onclick = () => { reset(); draw(); };
  renderBtns(); draw();
}

/* ====== simulador de listas ====== */
const LCODE = {
  adelante: `procedure agregarAdelante(var L : lista; n : integer);
var nue : lista;
begin
  new(nue);
  nue^.dato := n;
  nue^.sig := L;
  L := nue;
end;`,
  atras: `procedure agregarAtras(var pri, ult : lista; n : integer);
var nue : lista;
begin
  new(nue);
  nue^.dato := n;
  nue^.sig := nil;
  if (pri = nil) then pri := nue
  else ult^.sig := nue;
  ult := nue;
end;`,
  ordenado: `procedure insertarOrdenado(var pri : lista; n : integer);
var nue, ant, act : lista;
begin
  new(nue);
  nue^.dato := n;
  act := pri; ant := pri;
  while (act <> nil) and (act^.dato < n) do begin
    ant := act;
    act := act^.sig;
  end;
  if (act = pri) then pri := nue
  else ant^.sig := nue;
  nue^.sig := act;
end;`,
  eliminar: `procedure eliminar(var pri : lista; n : integer; var ok : boolean);
var ant, act : lista;
begin
  act := pri; ant := pri;
  while (act <> nil) and (act^.dato <> n) do begin
    ant := act;
    act := act^.sig;
  end;
  ok := (act <> nil);
  if ok then begin
    if (act = pri) then pri := act^.sig
    else ant^.sig := act^.sig;
    dispose(act);
  end;
end;`,
  recorrer: `procedure imprimir(L : lista);
begin
  while (L <> nil) do begin
    writeln(L^.dato);
    L := L^.sig;
  end;
end;`
};
function simListas(pane) {
  let list = [10, 21, 35];
  let op = "adelante";
  pane.innerHTML = `
    <p style="max-width:70ch;margin:0 0 14px;color:var(--muted)">Cada caja es un nodo: el dato y el puntero sig. Las etiquetas muestran a dónde apuntan pri, ult, ant, act y nue en cada paso del código.</p>
    <div class="sim">
      <div class="stage">
        <div class="controls"><label class="field"><span>Valor</span><input id="lval" type="number" value="18"></label></div>
        <div class="row">
          <button class="btn pri" type="button" data-lop="adelante">Agregar adelante</button>
          <button class="btn" type="button" data-lop="atras">Agregar atrás</button>
          <button class="btn" type="button" data-lop="ordenado">Insertar ordenado</button>
          <button class="btn" type="button" data-lop="eliminar">Eliminar valor</button>
          <button class="btn" type="button" data-lop="recorrer">Recorrer e imprimir</button>
        </div>
        <div class="row">
          <button class="btn" type="button" id="lej">Lista de ejemplo ordenada</button>
          <button class="btn" type="button" id="lvac">Lista vacía (pri := nil)</button>
        </div>
        <div class="nuebox" id="lnue"></div>
        <div class="lst" id="llst"></div>
        <div class="out" id="lout"></div>
        <div class="msg" id="lmsg"></div>
        <div id="lplay"></div>
      </div>
      <div id="lcode"></div>
    </div>`;
  const draw = (f) => {
    const n = f.list.length, lb = f.lb || {}, lb2 = f.lb2 || {}, cls = f.cls || {};
    const label = i => { const a = []; if (f.ult && i === n - 1) a.push("ult"); (lb[i] || []).forEach(x => a.push(x)); return a.join(" · "); };
    let h = `<span class="ptr">${n ? "pri →" : "pri = nil"}</span>`;
    f.list.forEach((d, i) => {
      const l = label(i), l2 = (lb2[i] || []).join(" · ");
      h += `<div class="node ${cls[i] || ""}">${l ? `<span class="lb">${l}</span>` : ""}<span class="d">${d}</span><span class="sg">sig</span>${l2 ? `<span class="lb2">${l2}</span>` : ""}</div><span class="arrow" aria-hidden="true"></span>`;
    });
    if (n) h += `<span class="nil" style="position:relative">${(lb[n] || []).length ? `<span class="lb" style="position:absolute;top:-22px;left:0;right:0;text-align:center;font-family:var(--f-code);font-size:11px;font-weight:700;color:var(--accent)">${lb[n].join(" · ")}</span>` : ""}nil</span>`;
    const box = $("#llst", pane); box.innerHTML = h;
    const foc = box.querySelector(".node.nw, .node.del, .node.hl");
    if (foc) box.scrollLeft = Math.max(0, foc.offsetLeft - box.clientWidth / 2);
    $("#lnue", pane).innerHTML = f.nue ? `<span class="ptr">nue →</span><div class="node nw"><span class="d">${f.nue.d}</span><span class="sg">sig</span></div><span>${f.nue.s ? "sig → " + f.nue.s : "sig: sin asignar"}</span>` : "";
    $("#lout", pane).textContent = f.out || "";
    setMsg($("#lmsg", pane), f);
    setCodeLine($("#lcode", pane), f.line);
  };
  const player = new Player($("#lplay", pane), draw);
  const showCode = k => { $("#lcode", pane).innerHTML = ide(LCODE[k], { numbers: true, title: k === "recorrer" ? "imprimir" : k }); };
  function run(k) {
    op = k;
    const v = parseInt($("#lval", pane).value, 10);
    if (Number.isNaN(v) && k !== "recorrer") { toast("Ingresá un valor numérico"); return; }
    if ((k === "adelante" || k === "atras" || k === "ordenado") && list.length >= 9) { toast("La lista de prueba admite hasta 9 nodos"); return; }
    const F = []; let L = list.slice();
    const fr = (line, msg, o = {}) => F.push(Object.assign({ line, msg, list: L.slice() }, o));
    const desc = i => i < L.length ? `el nodo ${L[i]}` : "nil";
    if (k === "adelante") {
      fr(4, "new(nue): se reserva memoria para un nodo nuevo.", { nue: { d: "?" } });
      fr(5, `nue^.dato := ${v}.`, { nue: { d: v } });
      fr(6, `nue^.sig := L. El nuevo nodo apunta a lo que hoy es el primero: ${L.length ? "el nodo " + L[0] : "nil"}.`, { nue: { d: v, s: L.length ? "nodo " + L[0] : "nil" }, cls: { 0: "hl" } });
      L.unshift(v); fr(7, `L := nue. Ahora el primero es ${v}. Por eso la lista queda en orden inverso al de lectura.`, { cls: { 0: "nw" }, kind: "ok" });
    }
    if (k === "atras") {
      fr(4, "new(nue).", { nue: { d: "?" }, ult: true });
      fr(5, `nue^.dato := ${v}.`, { nue: { d: v }, ult: true });
      fr(6, "nue^.sig := nil: va a ser el último.", { nue: { d: v, s: "nil" }, ult: true });
      if (!L.length) fr(7, "pri = nil: la lista estaba vacía, así que pri := nue.", { nue: { d: v, s: "nil" }, ult: true });
      else fr(8, `ult^.sig := nue: el último actual (${L[L.length - 1]}) se engancha con el nuevo. No hizo falta recorrer.`, { nue: { d: v, s: "nil" }, ult: true, cls: { [L.length - 1]: "hl" } });
      L.push(v); fr(9, "ult := nue.", { ult: true, cls: { [L.length - 1]: "nw" }, kind: "ok" });
    }
    if (k === "ordenado") {
      const sorted = L.every((x, i) => i === 0 || L[i - 1] <= x);
      fr(4, "new(nue).", { nue: { d: "?" } });
      fr(5, `nue^.dato := ${v}.`, { nue: { d: v } });
      let act = 0, ant = 0;
      const lab = () => { const o = {}; const add = (i, s) => (o[i] ||= []).push(s); add(ant, "ant"); add(act, "act"); if (act === ant && act >= L.length) o[act] = ["ant", "act"]; return o; };
      fr(6, "act := pri; ant := pri.", { nue: { d: v }, lb: lab() });
      if (!sorted) fr(6, "Ojo: la lista no está ordenada, así que el resultado tampoco lo va a estar. Usá \"Lista de ejemplo ordenada\".", { nue: { d: v }, lb: lab(), kind: "err" });
      while (act < L.length && L[act] < v) {
        fr(7, `${L[act]} < ${v}: hay que seguir avanzando.`, { nue: { d: v }, lb: lab(), cls: { [act]: "hl" } });
        ant = act; fr(8, "ant := act.", { nue: { d: v }, lb: lab() });
        act++; fr(9, `act := act^.sig (${desc(act)}).`, { nue: { d: v }, lb: lab() });
      }
      fr(7, act < L.length ? `${L[act]} ≥ ${v}: el nuevo va antes de act.` : "act = nil: el nuevo va al final.", { nue: { d: v }, lb: lab(), cls: act < L.length ? { [act]: "hl" } : {} });
      if (act === 0) fr(11, "act = pri: el nuevo va primero, así que pri := nue.", { nue: { d: v, s: desc(0) }, lb: lab() });
      else fr(12, `ant^.sig := nue: el nodo ${L[ant]} ahora apunta al nuevo.`, { nue: { d: v }, lb: lab(), cls: { [ant]: "hl" } });
      const pos = act; L.splice(pos, 0, v);
      fr(13, `nue^.sig := act. El ${v} quedó enganchado entre ${pos ? L[pos - 1] : "pri"} y ${pos + 1 < L.length ? L[pos + 1] : "nil"}.`, { cls: { [pos]: "nw" }, kind: "ok" });
    }
    if (k === "eliminar") {
      let act = 0, ant = 0;
      const lab = () => { const o = {}; (o[ant] ||= []).push("ant"); (o[act] ||= []).push("act"); return o; };
      fr(4, "act := pri; ant := pri.", { lb: lab() });
      while (act < L.length && L[act] !== v) {
        fr(5, `${L[act]} ≠ ${v}: sigo buscando.`, { lb: lab(), cls: { [act]: "hl" } });
        ant = act; fr(6, "ant := act.", { lb: lab() });
        act++; fr(7, `act := act^.sig (${desc(act)}).`, { lb: lab() });
      }
      if (act >= L.length) fr(9, `act = nil: ${v} no está en la lista. ok := false.`, { lb: lab(), kind: "err" });
      else {
        fr(9, `Encontrado: ok := true.`, { lb: lab(), cls: { [act]: "del" } });
        if (act === 0) fr(11, `Es el primero: pri := act^.sig (${desc(1)}).`, { lb: lab(), cls: { 0: "del" } });
        else fr(12, `ant^.sig := act^.sig: el ${L[ant]} saltea al ${v} y apunta a ${desc(act + 1)}.`, { lb: lab(), cls: { [act]: "del", [ant]: "hl" } });
        L.splice(act, 1); fr(13, "dispose(act): se libera la memoria del nodo.", { kind: "ok" });
      }
    }
    if (k === "recorrer") {
      let out = "";
      for (let i = 0; i < L.length; i++) {
        fr(3, `L <> nil: L apunta al ${L[i]}.`, { lb: { [i]: ["L"] }, out });
        out += L[i] + "\n"; fr(4, `Se imprime ${L[i]}.`, { lb: { [i]: ["L"] }, cls: { [i]: "hl" }, out });
        fr(5, "L := L^.sig.", { lb: { [i + 1]: ["L"] }, out });
      }
      fr(3, "L = nil: fin del recorrido. Como L se pasó por valor, el pri del programa no se movió.", { lb: { [L.length]: ["L"] }, out, kind: "ok" });
    }
    list = L;
    showCode(k);
    player.load(F, true);
  }
  $$("[data-lop]", pane).forEach(b => b.onclick = () => run(b.dataset.lop));
  $("#lej", pane).onclick = () => { list = [5, 12, 18, 30, 44]; showCode(op); player.load([{ line: 0, msg: "Lista ordenada de forma ascendente. Probá insertar ordenado un 20 o un 2.", list: list.slice() }]); };
  $("#lvac", pane).onclick = () => { list = []; showCode(op); player.load([{ line: 0, msg: "Lista vacía: pri = nil.", list: [] }]); };
  showCode(op);
  player.load([{ line: 0, msg: "Elegí una operación. El valor se toma del campo de arriba.", list: list.slice() }]);
}

/* ====== inicio ====== */
renderNav();
route(true);
</script>
